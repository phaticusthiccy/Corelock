name: Build and Release CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (Release)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Corelock Executable
        run: cmake --build build --config Release --parallel

      - name: Verify Binary Output
        shell: pwsh
        run: |
          if (Test-Path "build/Release/Corelock.exe") {
            Write-Host "Binary built successfully at build/Release/Corelock.exe"
          } elseif (Test-Path "build/Corelock.exe") {
            Write-Host "Binary built successfully at build/Corelock.exe"
          } else {
            throw "Corelock.exe was not found in expected build outputs!"
          }

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Corelock-x64
          path: |
            build/Release/Corelock.exe
            build/Corelock.exe
          if-no-files-found: error

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Corelock Latest Build"
          body: |
            Automated production build of **Corelock** from `${{ github.sha }}`.

            - **Platform**: Windows 10 / 11 (x64)
            - **Binary**: Corelock.exe
            - **Anti-Cheat Safe**: 100% Out-of-Process
          prerelease: true
          files: |
            build/Release/Corelock.exe
            build/Corelock.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


