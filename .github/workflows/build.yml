name: Build and Release CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Corelock Executable
        run: cmake --build build --config Release --parallel

      - name: Verify Binary Output
        shell: pwsh
        run: |
          if (Test-Path "build/Release/GameOptimizer.exe") {
            Write-Host "Binary built successfully at build/Release/GameOptimizer.exe"
          } elseif (Test-Path "build/GameOptimizer.exe") {
            Write-Host "Binary built successfully at build/GameOptimizer.exe"
          } else {
            throw "GameOptimizer.exe was not found in expected build outputs!"
          }

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Corelock-GameOptimizer-x64
          path: |
            build/Release/GameOptimizer.exe
            build/GameOptimizer.exe
          if-no-files-found: error
